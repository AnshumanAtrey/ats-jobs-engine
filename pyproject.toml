[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-jobs-engine"
version = "0.7.1"
description = "One search engine for applicant tracking systems and job boards: every platform's jobs in one shape, read live, one or many at once."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["apify>=4.2,<5", "httpx==0.28.1", "pycountry==26.2.16"]

[project.optional-dependencies]
instahyre = ["curl_cffi==0.17.0"]   # Instahyre shows its job pages (the posting date) only to a browser's TLS

[tool.setuptools.packages.find]
include = ["ats_jobs*"]

[tool.setuptools.package-data]
ats_jobs = ["data/*.tsv"]
